name: build

# Builds the kernel, the boot chain and the generic image on native ARM
# runners and pushes everything to the nixos-a733 Cachix cache.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - flake.nix
      - flake.lock
      - kernel/**
      - patches/**
      - bootloader/**
      - modules/**
      - images/**

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: nixos-a733
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Patch kernel source
        id: source
        run: |
          nix build -L .#kernel-source -o source
          echo "version=$(jq -r .version kernel/version.json)" >> "$GITHUB_OUTPUT"

      - name: Report skipped optional patches
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
        run: ci/report-skipped.sh source/.a733-optional-skipped "$VERSION"

      - name: Build kernel
        run: nix build -L .#kernel

      - name: Build boot chain
        run: |
          for pkg in boot0 tf-a uboot; do
            if nix eval .#packages.aarch64-linux --apply "p: p ? \"$pkg\"" | grep -q true; then
              nix build -L ".#$pkg"
            else
              echo "$pkg is not pinned yet, skipping"
            fi
          done

      - name: Build generic image
        run: nix build -L .#sd-image-generic

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/report-failure.sh "$VERSION" "$RUN_URL"
