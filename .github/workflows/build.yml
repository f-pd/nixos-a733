name: build

# Builds the kernel, the boot chain and the generic image on native ARM
# runners and pushes everything to the nixos-a733 Cachix cache.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - flake.nix
      - flake.lock
      - kernel/**
      - patches/**
      - bootloader/**
      - modules/**
      - images/**
      - vendor/**

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  # The mainline kernel is only worth building once it carries the A733
  # patches: without them it is a plain kernel.org build that cannot boot the
  # board. The job turns itself on with the first base patch.
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      mainline: ${{ steps.patches.outputs.mainline }}
    steps:
      - uses: actions/checkout@v7
      - name: Look for base patches
        id: patches
        run: |
          count=$(jq '[.patches[] | select(.layer == "base")] | length' patches/index.json)
          echo "Base patches: $count"
          if [ "$count" -gt 0 ]; then
            echo "mainline=true" >> "$GITHUB_OUTPUT"
          else
            echo "mainline=false" >> "$GITHUB_OUTPUT"
          fi

  mainline:
    needs: plan
    if: needs.plan.outputs.mainline == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nixos-a733
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # SD images and patched kernel sources are big and rebuilt every run; keep them out of the cache.
          # Anything marked nopublish holds firmware without a redistribution grant.
          pushFilter: '(-source$|-source-[0-9][^/]*$|\.img(\.zst)?$|-nopublish)'

      - name: Patch kernel source
        id: source
        run: |
          nix build -L .#kernel-source -o source
          echo "version=$(jq -r .version kernel/version.json)" >> "$GITHUB_OUTPUT"

      - name: Report skipped optional patches
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
        run: ci/report-skipped.sh source/.a733-optional-skipped "$VERSION"

      - name: Build kernel
        run: nix build -L .#kernel

      - name: Build generic image
        run: nix build -L .#sd-image-generic

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/report-failure.sh "$VERSION" "$RUN_URL"

  # The mainline boot chain: BL31 and U-Boot with our DRAM init, one file for
  # the card. It links the PHY training firmware, which has no redistribution
  # grant: the push filter keeps it out of the cache, and nothing of it is
  # uploaded. What is uploaded is the SPL built with zeros in place of that
  # firmware, ELF and symbols included, for checking its DRAM path against
  # the reference scripts.
  firmware:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nixos-a733
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # SD images and patched kernel sources are big and rebuilt every run; keep them out of the cache.
          # Anything marked nopublish holds firmware without a redistribution grant.
          pushFilter: '(-source$|-source-[0-9][^/]*$|\.img(\.zst)?$|-nopublish)'

      - name: Check the DRAM library against the reference scripts
        run: make -C bootloader/dram check

      - name: Build BL31
        run: nix build -L .#tf-a -o result-tf-a

      - name: Build firmware
        run: nix build -L .#firmware -o result-firmware

      - name: Check firmware layout
        run: |
          ls -l result-firmware/
          python3 ci/check-firmware.py result-firmware/u-boot-sunxi-with-spl.bin

      - name: Build SPL without the PHY firmware
        run: |
          nix build -L .#spl-zero-payload -o result-spl
          mkdir spl-zero-payload
          cp result-spl/sunxi-spl.bin result-spl/u-boot-spl result-spl/u-boot-spl.map result-spl/.config spl-zero-payload/
          cp result-tf-a/bl31.elf spl-zero-payload/
          python3 ci/check-firmware.py result-spl/u-boot-sunxi-with-spl.bin
          sha256sum spl-zero-payload/* | tee spl-zero-payload/SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: a733-spl-zero-payload
          path: spl-zero-payload/
          include-hidden-files: true
          retention-days: 30

  # The manufacturer's U-Boot is built with a compiler that only exists for
  # x86-64 hosts (and crashes under qemu-user), so it is built on an x86-64
  # runner and reaches the ARM job through Cachix.
  vendor-uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nixos-a733
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # SD images and patched kernel sources are big and rebuilt every run; keep them out of the cache.
          # Anything marked nopublish holds firmware without a redistribution grant.
          pushFilter: '(-source$|-source-[0-9][^/]*$|\.img(\.zst)?$|-nopublish)'
      - name: Build manufacturer U-Boot
        run: nix build -L .#packages.aarch64-linux.boot-vendor.uboot

  # Phase 3: manufacturer kernel, U-Boot and boot blobs. The image is kept as a
  # workflow artifact, ready to write to an SD card.
  vendor:
    needs: vendor-uboot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: nixos-a733
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # SD images and patched kernel sources are big and rebuilt every run; keep them out of the cache.
          # Anything marked nopublish holds firmware without a redistribution grant.
          pushFilter: '(-source$|-source-[0-9][^/]*$|\.img(\.zst)?$|-nopublish)'

      - name: Build manufacturer kernel
        run: nix build -L .#kernel-vendor

      - name: Build manufacturer boot chain
        run: nix build -L .#boot-vendor

      - name: Build image
        run: |
          nix build -L .#sd-image-vendor -o image
          cp image/sd-image/*.img.zst nixos-a733-vendor.img.zst
          sha256sum nixos-a733-vendor.img.zst > nixos-a733-vendor.img.zst.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: nixos-a733-vendor-image
          path: |
            nixos-a733-vendor.img.zst
            nixos-a733-vendor.img.zst.sha256
          retention-days: 30

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/report-failure.sh "6.6 vendor" "$RUN_URL"
