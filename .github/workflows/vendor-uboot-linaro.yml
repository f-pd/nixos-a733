name: vendor-uboot-linaro

# Boot test for the vendor image: the manufacturer's U-Boot built the way
# orangepi-build builds it, with Linaro GCC 7.4.1 arm-linux-gnueabi (what its
# find_toolchain picks for UBOOT_USE_GCC='> 6.0') on an x86-64 host, packed
# with their tools, written into the latest develop pre-release image. The
# result is published as a pre-release <base tag>-linaro-uboot, together with
# both boot packages, to tell a compiler problem from anything else.
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/vendor-uboot-linaro.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TOOLCHAIN: gcc-linaro-7.4.1-2019.02-x86_64_arm-linux-gnueabi
  TOOLCHAIN_URL: https://releases.linaro.org/components/toolchain/binaries/7.4-2019.02/arm-linux-gnueabi/gcc-linaro-7.4.1-2019.02-x86_64_arm-linux-gnueabi.tar.xz

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bison flex bc libssl-dev dos2unix zstd jq xxd

      - name: Fetch the Linaro toolchain
        run: |
          curl -fsSL -o toolchain.tar.xz "$TOOLCHAIN_URL"
          sha256sum toolchain.tar.xz
          mkdir -p toolchain
          tar -xJf toolchain.tar.xz -C toolchain --strip-components=1
          toolchain/bin/arm-linux-gnueabi-gcc --version | head -1
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned U-Boot and orangepi-build
        run: |
          fetch() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch u-boot "$(jq -r '."u-boot" | "\(.owner)/\(.repo)"' vendor/sources.json)" \
            "$(jq -r '."u-boot".rev' vendor/sources.json)"
          git init -q orangepi-build
          git -C orangepi-build remote add origin \
            "https://github.com/$(jq -r '.build | "\(.owner)/\(.repo)"' vendor/sources.json).git"
          git -C orangepi-build sparse-checkout set external/packages/pack-uboot
          git -C orangepi-build fetch -q --depth 1 --filter=blob:none origin "$(jq -r .build.rev vendor/sources.json)"
          git -C orangepi-build checkout -q FETCH_HEAD

      # compile_uboot in orangepi-build: make <defconfig>, the LOCALVERSION and
      # BOOTDELAY settings, then make with the default target.
      - name: Build U-Boot
        working-directory: u-boot
        run: |
          mkdir -p ../tools/toolchain/riscv64-linux-x86_64-20200528 \
            ../tools/toolchain/gcc-linaro-7.2.1-2017.11-x86_64_arm-linux-gnueabi
          defconfig=$(jq -r '."u-boot".defconfig' ../vendor/sources.json)
          make "$defconfig" CROSS_COMPILE=arm-linux-gnueabi-
          sed -i 's/CONFIG_LOCALVERSION=""/CONFIG_LOCALVERSION="-orangepi"/' .config
          sed -i 's/^CONFIG_BOOTDELAY=.*/CONFIG_BOOTDELAY=1/' .config
          touch .scmversion
          make -j"$(nproc)" CROSS_COMPILE=arm-linux-gnueabi-
          ls -l u-boot.bin u-boot-nodtb.bin

      # uboot_custom_postprocess in the sun60iw2 family config, with their dtc.
      - name: Pack boot0 and boot_package
        run: |
          bin=orangepi-build/external/packages/pack-uboot/sun60iw2/bin
          tools=$PWD/orangepi-build/external/packages/pack-uboot/tools
          mkdir pack && cd pack
          cp ../$bin/boot0_sdcard_orangepizero3w.fex boot0_sdcard.fex
          cp ../$bin/monitor.fex ../$bin/scp.fex ../$bin/boot_package.cfg .
          cp ../$bin/sys_config/sys_config.fex sys_config.fex
          cp ../u-boot/u-boot.bin u-boot.fex
          "$tools/dtc" -p 2048 -W no-unit_address_vs_reg -@ -O dtb -o sunxi.fex -b 0 ../$bin/dts/u-boot-current.dts
          unix2dos sys_config.fex
          "$tools/script" sys_config.fex
          "$tools/update_dtb" sunxi.fex 4096
          "$tools/update_uboot" -no_merge u-boot.fex sys_config.bin
          unix2dos boot_package.cfg
          "$tools/dragonsecboot" -pack boot_package.cfg
          ls -l boot0_sdcard.fex boot_package.fex

      - name: Write them into the latest develop pre-release
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh release list --limit 50 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.[0-9]+$")))][0].tagName')
          echo "base pre-release: $base"
          gh release download "$base" --pattern '*.img.zst'
          zstd -dq --rm ./*.img.zst -o image.img

          # The package length is the valid_len field of its header, at 36.
          offset=$(jq .sdLayout.bootPackageOffsetKiB vendor/sources.json)
          dd if=image.img of=ours-boot_package.fex bs=1K skip="$offset" count=4096 status=none
          size=$(od -An -t u4 -j 36 -N 4 ours-boot_package.fex | tr -d ' ')
          truncate -s "$size" ours-boot_package.fex
          echo "boot_package sizes: ours $size, linaro $(stat -c %s pack/boot_package.fex)"
          echo "boot_package, ours:   $(sha256sum < ours-boot_package.fex)"
          echo "boot_package, linaro: $(sha256sum < pack/boot_package.fex)"

          dd if=pack/boot0_sdcard.fex of=image.img bs=1K seek="$(jq .sdLayout.boot0OffsetKiB vendor/sources.json)" conv=notrunc status=none
          dd if=pack/boot_package.fex of=image.img bs=1K seek="$offset" conv=notrunc status=none

          tag="$base-linaro-uboot"
          zstd -q -T0 image.img -o "nixos-a733-vendor-$tag.img.zst"
          sha256sum "nixos-a733-vendor-$tag.img.zst" > "nixos-a733-vendor-$tag.img.zst.sha256"
          cp pack/boot_package.fex linaro-boot_package.fex
          cp u-boot/u-boot.bin linaro-u-boot.bin
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.image.outputs.base }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$TAG" \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "The $BASE image with the manufacturer's U-Boot built with Linaro GCC 7.4.1 arm-linux-gnueabi, as orangepi-build does. Boot test only. ours-boot_package.fex and linaro-boot_package.fex are the two boot packages, for comparison." \
            "nixos-a733-vendor-$TAG.img.zst" \
            "nixos-a733-vendor-$TAG.img.zst.sha256" \
            ours-boot_package.fex linaro-boot_package.fex linaro-u-boot.bin
