name: vendor-boot-bisect

# Boot test for the vendor image: two variants of the latest develop
# pre-release, each closer to the manufacturer's image than the last, to find
# what keeps it from reaching the kernel. Published together as the
# pre-release <base tag>-bisect.
#
# t1: boot.scr without the boot log (no env export, no fatwrite);
# t2: t1, with the root file system as partition 1, as on the manufacturer's
#     image (the FAT partition becomes entry 2 of the partition table).
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/vendor-boot-bisect.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q u-boot-tools e2fsprogs zstd jq

      - name: Fetch the latest develop pre-release
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh release list --limit 50 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-dev\\.[0-9]+$")))][0].tagName')
          echo "base pre-release: $base"
          gh release download "$base" --pattern '*.img.zst'
          zstd -dq --rm ./*.img.zst -o base.img
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: t1, boot.scr without the boot log
        run: |
          cp base.img t1.img
          start=$(sfdisk -J t1.img | jq '.partitiontable.partitions[1].start')
          dd if=t1.img of=root.img bs=512 skip="$start" status=none
          debugfs -R 'cat /boot/boot.cmd' root.img > boot.cmd
          # Drop every line that writes the log; the rest is the 0.2.0 script.
          grep -v -e 'fatwrite' -e 'env export' -e 'run a733_save' -e 'setenv a733_save' boot.cmd > boot-t1.cmd
          diff boot.cmd boot-t1.cmd || true
          mkimage -C none -A arm -T script -d boot-t1.cmd boot-t1.scr
          printf '%s\n' 'rm /boot/boot.scr' 'rm /boot/boot.cmd' 'cd /boot' \
            'write boot-t1.scr boot.scr' 'write boot-t1.cmd boot.cmd' > debugfs.cmds
          debugfs -w -f debugfs.cmds root.img
          debugfs -R 'ls -l /boot' root.img
          e2fsck -fn root.img
          dd if=root.img of=t1.img bs=512 seek="$start" conv=notrunc status=none

      - name: t2, root file system as partition 1
        run: |
          cp t1.img t2.img
          # Swap the two 16-byte MBR entries at 0x1be and 0x1ce.
          dd if=t2.img of=e1 bs=1 skip=446 count=16 status=none
          dd if=t2.img of=e2 bs=1 skip=462 count=16 status=none
          dd if=e2 of=t2.img bs=1 seek=446 conv=notrunc status=none
          dd if=e1 of=t2.img bs=1 seek=462 conv=notrunc status=none
          sfdisk -l t2.img

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          tag="$BASE-bisect"
          files=()
          for t in t1 t2; do
            zstd -q -T0 "$t.img" -o "nixos-a733-vendor-$tag-$t.img.zst"
            sha256sum "nixos-a733-vendor-$tag-$t.img.zst" > "nixos-a733-vendor-$tag-$t.img.zst.sha256"
            files+=("nixos-a733-vendor-$tag-$t.img.zst" "nixos-a733-vendor-$tag-$t.img.zst.sha256")
          done
          gh release delete "$tag" --yes --cleanup-tag 2> /dev/null || true
          gh release create "$tag" \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Boot test of the $BASE image. t1: boot.scr without the boot log on the FAT partition. t2: t1 with the root file system as partition 1, as on the manufacturer's image. Try t1 first." \
            "${files[@]}"
