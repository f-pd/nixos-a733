# mke2fs settings for the root file system of the vendor SD image.
#
# The manufacturer's U-Boot 2018.05 reads /boot from this file system. Orange
# Pi formats their images with -O ^64bit,^metadata_csum for it; the features
# e2fsprogs added since (metadata_csum_seed, orphan_file) are left out too.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,dir_nlink,extra_isize
	}
	small = {
		inode_ratio = 4096
	}
	floppy = {
		inode_ratio = 8192
	}
